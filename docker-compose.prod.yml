# Entorno de producción del frontend gestaller (SPA servida por Caddy).
#
# Uso en el VPS (desde la raíz del workspace, vía prod.sh o manual):
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Requiere que el backend (repo gestaller-api) esté levantado con su
# docker-compose.prod.yml: ambos comparten la red Docker "gestaller-prod" y
# Caddy resuelve la API por su nombre de servicio (http://api:8000).
#
# PUBLIC_HOST es OBLIGATORIO (dominio público apuntando al VPS): Caddy emite
# Let's Encrypt automáticamente y redirige http→https. Se publican los puertos
# 80 (reto HTTP-01 + redirección) y 443 (HTTPS) en todas las interfaces.
#
# La SPA se compila con VITE_API_URL vacío ⇒ usa /api same-origin:
# Caddy reenvía /api/* al backend.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: gestaller-prod-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gestaller-prod

networks:
  gestaller-prod:
    external: true
    name: gestaller-prod